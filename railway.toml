[build]
builder = "nixpacks"

[deploy]
startCommand = "npx prisma migrate resolve --rolled-back 20260714185141_add_avatar_and_chat_messages 2>/dev/null; npx prisma migrate resolve --rolled-back 20260714200000_add_audit_log_and_legal_fields 2>/dev/null; npx prisma migrate deploy && next start"
# §236 Geprüft wird `/api/health`, nicht mehr die Startseite.
#
# Die Startseite läuft durch die Middleware, und seit §235 leitet die auf die
# kanonische Domain um — der Prüfer bekam 308 statt 200, und drei Ausrollungen
# wurden verworfen, obwohl Build und Migration sauber durchliefen. Unter `/api`
# greift die Weiterleitung nie.
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"

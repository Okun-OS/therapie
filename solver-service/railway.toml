[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
# Beide Schreibweisen: greift sowohl bei Service-Root "/" als auch "/solver-service"
watchPatterns = ["solver-service/**", "**/*.py", "requirements.txt", "Dockerfile"]

[deploy]
# §90: healthcheckPath bewusst NICHT gesetzt. Der Versuch aus §88 ließ zwei
# Deploys an "Healthcheck failure" scheitern, weil der Dienst nur auf IPv4
# lauschte. Die Bindung ist jetzt dual-stack (main.py) — der Healthcheck kann
# nachgezogen werden, sobald ein Deploy damit nachweislich grün ist. Bis dahin
# gilt: lieber ein laufender Dienst ohne Healthcheck als ein blockierter Deploy.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
